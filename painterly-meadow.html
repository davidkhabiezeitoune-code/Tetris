<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painterly Meadow — 3D</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: #1a2214; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 58%, rgba(0,0,0,0) 35%, rgba(18,12,6,0.38) 100%);
  }
  #grain {
    position: fixed; inset: 0; pointer-events: none;
    opacity: 0.4; mix-blend-mode: overlay;
  }
  #hint {
    position: fixed; left: 18px; bottom: 14px;
    font: 13px/1.4 Georgia, 'Times New Roman', serif;
    color: rgba(255,250,235,0.75);
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    pointer-events: none;
    transition: opacity 1.2s ease;
  }
  #title {
    position: fixed; left: 18px; top: 14px;
    font: italic 20px/1.2 Georgia, 'Times New Roman', serif;
    color: rgba(255,250,235,0.85);
    text-shadow: 0 1px 4px rgba(0,0,0,0.55);
    pointer-events: none;
  }
  #fallback {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    color: #eee; font: 16px Georgia, serif; text-align: center; padding: 20px;
    background: #1a2214;
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="vignette"></div>
<canvas id="grain"></canvas>
<div id="title">Painterly Meadow</div>
<div id="hint">drag to look around &middot; scroll to zoom &middot; right-drag (or two fingers) to pan</div>
<div id="fallback">Your browser doesn't support WebGL2, so this 3D scene can't render here.</div>
<script>
'use strict';

const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl2', { antialias: true, alpha: false });
if (!gl) {
  document.getElementById('fallback').style.display = 'flex';
  throw new Error('WebGL2 unavailable');
}

// ─────────────────────────────────────────────────────────
//  MATH HELPERS
// ─────────────────────────────────────────────────────────
function mat4Perspective(fovy, aspect, near, far) {
  const f = 1 / Math.tan(fovy / 2);
  const out = new Float32Array(16);
  out[0] = f / aspect; out[5] = f;
  out[10] = (far + near) / (near - far); out[11] = -1;
  out[14] = (2 * far * near) / (near - far);
  return out;
}

function v3sub(a, b) { return [a[0]-b[0], a[1]-b[1], a[2]-b[2]]; }
function v3add(a, b) { return [a[0]+b[0], a[1]+b[1], a[2]+b[2]]; }
function v3scale(a, s) { return [a[0]*s, a[1]*s, a[2]*s]; }
function v3cross(a, b) { return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }
function v3norm(a) { const l = Math.hypot(a[0],a[1],a[2]) || 1; return [a[0]/l, a[1]/l, a[2]/l]; }
function v3dot(a, b) { return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; }
function mulberry32(seed) {
  return function() {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function mat4LookAt(eye, center, up) {
  const z = v3norm(v3sub(eye, center));
  const x = v3norm(v3cross(up, z));
  const y = v3cross(z, x);
  const out = new Float32Array(16);
  out[0]=x[0]; out[1]=y[0]; out[2]=z[0]; out[3]=0;
  out[4]=x[1]; out[5]=y[1]; out[6]=z[1]; out[7]=0;
  out[8]=x[2]; out[9]=y[2]; out[10]=z[2]; out[11]=0;
  out[12] = -v3dot(x, eye); out[13] = -v3dot(y, eye); out[14] = -v3dot(z, eye); out[15] = 1;
  return out;
}

// ─────────────────────────────────────────────────────────
//  CPU NOISE (heightmap + placement)
// ─────────────────────────────────────────────────────────
function hash2(x, y) {
  const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
  return s - Math.floor(s);
}
function valueNoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const h00 = hash2(xi, yi), h10 = hash2(xi+1, yi), h01 = hash2(xi, yi+1), h11 = hash2(xi+1, yi+1);
  const u = xf*xf*(3-2*xf), v = yf*yf*(3-2*yf);
  const a = h00 + (h10-h00)*u, b = h01 + (h11-h01)*u;
  return a + (b-a)*v;
}
function fbm(x, y, octaves) {
  let total = 0, amp = 0.5, freq = 1, sum = 0;
  for (let i = 0; i < octaves; i++) {
    total += valueNoise(x*freq, y*freq) * amp;
    sum += amp; amp *= 0.5; freq *= 2;
  }
  return total / sum;
}
function baseHeightAt(x, z) {
  // Domain-warp the sampling coordinates so the macro hills come out organic
  // and non-repeating rather than looking like a plain noise grid.
  const warpX = (fbm(x*0.004+11, z*0.004+7, 2) - 0.5) * 22;
  const warpZ = (fbm(x*0.004-5, z*0.004+23, 2) - 0.5) * 22;
  const wx = x + warpX, wz = z + warpZ;
  const macro = (fbm(wx*0.010, wz*0.010, 4) - 0.5) * 15;
  const meso  = (fbm(x*0.05+50, z*0.05+50, 3) - 0.5) * 3.0;
  const micro = (fbm(x*0.22+150, z*0.22+150, 3) - 0.5) * 0.9;
  return macro + meso + micro;
}
function smoothstepJS(e0, e1, x) {
  const t = Math.max(0, Math.min(1, (x - e0) / (e1 - e0)));
  return t * t * (3 - 2 * t);
}

// ── Lake basin (irregular natural shoreline, carved into the terrain) ──
const LAKE = { x: 26, z: 8, halfWidth: 20, halfLength: 60, depth: 8.5 };
// Per-angle shoreline radius multiplier: a few sine harmonics plus fbm noise
// sampled around a circle, so the coastline reads as an irregular natural
// lake (bays, points) rather than a perfect ellipse. Shared by the terrain
// carve, the water mesh boundary, and the bridge span so everything lines up.
function lakeShoreFactor(angle) {
  let f = 1.0
    + 0.17 * Math.sin(angle * 2.0 + 1.3)
    + 0.12 * Math.sin(angle * 3.1 + 2.6)
    + 0.08 * Math.sin(angle * 5.3 + 0.5)
    + 0.05 * Math.sin(angle * 7.7 + 4.1);
  f += (fbm(Math.cos(angle) * 2.5 + 71, Math.sin(angle) * 2.5 + 71, 3) - 0.5) * 0.24;
  return Math.max(0.55, f);
}
function lakeMask(x, z) {
  const dx = (x - LAKE.x) / LAKE.halfWidth, dz = (z - LAKE.z) / LAKE.halfLength;
  const angle = Math.atan2(dz, dx);
  const shoreF = lakeShoreFactor(angle);
  const d = Math.hypot(dx, dz) / shoreF;
  return 1 - smoothstepJS(0.60, 1.0, d); // 1 at center, 0 at/after the shore
}

// ── Railway grade: a gentle corridor flattened toward a graded line ──
const TRACK_Z = LAKE.z;
const TRACK_X_START = -85, TRACK_X_END = 100;
const LAKE_SHORE_EAST = LAKE.halfWidth * lakeShoreFactor(0);
const LAKE_SHORE_WEST = LAKE.halfWidth * lakeShoreFactor(Math.PI);
const BRIDGE_X0 = LAKE.x - LAKE_SHORE_WEST - 3, BRIDGE_X1 = LAKE.x + LAKE_SHORE_EAST + 3;
const BRIDGE_DECK_Y = Math.max(baseHeightAt(BRIDGE_X0, TRACK_Z), baseHeightAt(BRIDGE_X1, TRACK_Z)) + 2.6;
const TRACK_Y_START = baseHeightAt(TRACK_X_START, TRACK_Z);
const TRACK_Y_END = baseHeightAt(TRACK_X_END, TRACK_Z);
function trackGradeY(x) {
  if (x < BRIDGE_X0) return TRACK_Y_START + (BRIDGE_DECK_Y - TRACK_Y_START) * smoothstepJS(TRACK_X_START, BRIDGE_X0, x);
  if (x > BRIDGE_X1) return BRIDGE_DECK_Y + (TRACK_Y_END - BRIDGE_DECK_Y) * smoothstepJS(BRIDGE_X1, TRACK_X_END, x);
  return BRIDGE_DECK_Y;
}
function heightAt(x, z) {
  let h = baseHeightAt(x, z);
  const lm = lakeMask(x, z);
  if (lm > 0) h -= lm * LAKE.depth;
  // Grade a flat rail corridor on dry land only — the bridge span itself
  // stays lake-carved (water sits underneath, not blended terrain).
  if (x < BRIDGE_X0 || x > BRIDGE_X1) {
    const corridor = 1 - smoothstepJS(7, 11, Math.abs(z - TRACK_Z));
    if (corridor > 0 && x > TRACK_X_START - 6 && x < TRACK_X_END + 6) {
      h += (trackGradeY(x) - h) * corridor;
    }
  }
  return h;
}

// ─────────────────────────────────────────────────────────
//  SHADERS
// ─────────────────────────────────────────────────────────
const SKY_VS = `#version 300 es
in vec2 aPos;
out vec2 vUv;
void main() { vUv = aPos; gl_Position = vec4(aPos, 0.9999, 1.0); }
`;

const SKY_FS = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 outColor;
uniform vec3 uCamForward, uCamRight, uCamUp;
uniform float uAspect, uTanFov;
uniform vec3 uSunDir;
uniform float uTime;

float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  float a = hash(i), b = hash(i+vec2(1.0,0.0)), c = hash(i+vec2(0.0,1.0)), d = hash(i+vec2(1.0,1.0));
  vec2 u = f*f*(3.0-2.0*f);
  return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
}
float fbm(vec2 p) {
  float t = 0.0, amp = 0.5;
  for (int i = 0; i < 5; i++) { t += noise(p) * amp; p *= 2.02; amp *= 0.5; }
  return t;
}

void main() {
  vec3 dir = normalize(uCamForward + uCamRight * (vUv.x * uAspect * uTanFov) + uCamUp * (vUv.y * uTanFov));
  float h = clamp(dir.y * 0.5 + 0.5, 0.0, 1.0);

  vec3 low   = vec3(0.90, 0.38, 0.26);
  vec3 mid   = vec3(0.96, 0.58, 0.34);
  vec3 upper = vec3(0.62, 0.42, 0.52);
  vec3 high  = vec3(0.13, 0.16, 0.36);
  vec3 sky = mix(low, mid, smoothstep(0.0, 0.22, h));
  sky = mix(sky, upper, smoothstep(0.22, 0.55, h));
  sky = mix(sky, high, smoothstep(0.55, 1.0, h));

  float sun = max(dot(dir, uSunDir), 0.0);
  sky += vec3(1.0, 0.78, 0.45) * pow(sun, 700.0) * 5.0;
  sky += vec3(1.0, 0.62, 0.32) * pow(sun, 40.0) * 1.1;
  sky += vec3(1.0, 0.5, 0.25) * pow(sun, 6.0) * 0.35;

  if (dir.y > -0.02) {
    vec2 cp = dir.xz / (dir.y + 0.35) * 0.6 + uTime * 0.006;
    float clouds = fbm(cp * 1.3);
    float mask = smoothstep(0.55, 0.85, clouds) * smoothstep(-0.02, 0.35, dir.y);
    vec3 cloudLit = mix(vec3(0.85, 0.42, 0.30), vec3(1.0, 0.85, 0.72), clamp(sun*1.4, 0.0, 1.0));
    sky = mix(sky, cloudLit, mask * 0.6);
  }

  outColor = vec4(sky, 1.0);
}
`;

const NOISE_GLSL = `
float hashG(vec2 p) { return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }
float noiseG(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  float a = hashG(i), b = hashG(i+vec2(1.0,0.0)), c = hashG(i+vec2(0.0,1.0)), d = hashG(i+vec2(1.0,1.0));
  vec2 u = f*f*(3.0-2.0*f);
  return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
}
vec2 windAt(vec2 p, float t) {
  float n1 = noiseG(p * 0.05 + vec2(t * 0.35, 0.0)) - 0.5;
  float n2 = noiseG(p * 0.15 + vec2(0.0, t * 0.6) + 30.0) - 0.5;
  float gust = sin(p.x * 0.06 + p.y * 0.03 - t * 1.6) * 0.5 + 0.35;
  float mag = (n1 * 0.6 + n2 * 0.4) + gust * 0.5;
  vec2 dir = normalize(vec2(0.8, 0.35));
  return dir * mag;
}
`;

const TERRAIN_VS = `#version 300 es
in vec3 aPos;
in vec3 aNormal;
in vec3 aColor;
out vec3 vColor;
out vec3 vNormal;
out float vDist;
uniform mat4 uProj, uView;
uniform vec3 uCamPos;
void main() {
  vColor = aColor;
  vNormal = aNormal;
  vDist = distance(aPos, uCamPos);
  gl_Position = uProj * uView * vec4(aPos, 1.0);
}
`;

const TERRAIN_FS = `#version 300 es
precision highp float;
in vec3 vColor;
in vec3 vNormal;
in float vDist;
out vec4 outColor;
uniform vec3 uSunDir;
uniform vec3 uFogColor;
void main() {
  float diffuse = max(dot(normalize(vNormal), uSunDir), 0.0);
  float banded = floor(diffuse * 3.0) / 3.0;
  float lightF = mix(diffuse, banded, 0.5) * 0.65 + 0.42;
  vec3 col = vColor * lightF;
  float fog = (1.0 - exp(-0.00006 * vDist * vDist)) * 0.82;
  col = mix(col, uFogColor, clamp(fog, 0.0, 1.0));
  outColor = vec4(col, 1.0);
}
`;

const GRASS_VS = `#version 300 es
in vec3 aLocal;
in vec3 aInstPos;
in vec4 aInstData; // scale, rotation, colorT, phase
out float vHeightFrac;
out float vColorT;
out float vDist;
uniform mat4 uProj, uView;
uniform vec3 uCamPos;
uniform float uTime;
${NOISE_GLSL}
void main() {
  float heightFrac = aLocal.y;
  float width = aInstData.x * 0.075;
  float height = aInstData.x * 0.62;
  vec3 local = vec3(aLocal.x * width, aLocal.y * height, aLocal.z * width);
  float ca = cos(aInstData.y), sa = sin(aInstData.y);
  vec3 rotated = vec3(local.x*ca - local.z*sa, local.y, local.x*sa + local.z*ca);
  vec3 worldPos = aInstPos + rotated;

  float w = heightFrac * heightFrac;
  vec2 wind = windAt(aInstPos.xz + aInstData.w * 4.0, uTime);
  worldPos.x += wind.x * w * height * 1.4;
  worldPos.z += wind.y * w * height * 1.4;
  worldPos.y -= dot(wind, wind) * w * height * 0.5;

  vHeightFrac = heightFrac;
  vColorT = aInstData.z;
  vDist = distance(worldPos, uCamPos);
  gl_Position = uProj * uView * vec4(worldPos, 1.0);
}
`;

const GRASS_FS = `#version 300 es
precision highp float;
in float vHeightFrac;
in float vColorT;
in float vDist;
out vec4 outColor;
uniform vec3 uFogColor;
void main() {
  vec3 dark  = mix(vec3(0.08,0.16,0.05), vec3(0.11,0.22,0.07), vColorT);
  vec3 light = mix(vec3(0.35,0.42,0.14), vec3(0.55,0.55,0.20), vColorT);
  vec3 col = mix(dark, light, smoothstep(0.0, 1.0, vHeightFrac));
  float fog = (1.0 - exp(-0.00006 * vDist * vDist)) * 0.82;
  col = mix(col, uFogColor, clamp(fog, 0.0, 1.0));
  outColor = vec4(col, 1.0);
}
`;

const FLOWER_VS = `#version 300 es
in vec2 aLocal;
in vec3 aInstPos;
in vec4 aInstData; // size, hue-select, sway phase, unused
out vec3 vColor;
out vec2 vLocal;
out float vDist;
uniform mat4 uProj, uView;
uniform vec3 uCamRight, uCamUp, uCamPos;
uniform float uTime;
void main() {
  float sway = sin(uTime * 1.4 + aInstData.z) * 0.05;
  vec3 worldPos = aInstPos
    + uCamRight * (aLocal.x * aInstData.x)
    + uCamUp * (aLocal.y * aInstData.x)
    + vec3(sway, 0.0, sway);
  vColor = aInstData.y > 0.5 ? vec3(0.95, 0.78, 0.25) : vec3(0.85, 0.30, 0.28);
  vLocal = aLocal;
  vDist = distance(worldPos, uCamPos);
  gl_Position = uProj * uView * vec4(worldPos, 1.0);
}
`;

const FLOWER_FS = `#version 300 es
precision highp float;
in vec3 vColor;
in vec2 vLocal;
in float vDist;
out vec4 outColor;
uniform vec3 uFogColor;
void main() {
  float d = length(vLocal);
  if (d > 1.0) discard;
  vec3 center = mix(vColor, vec3(0.98, 0.85, 0.35), smoothstep(0.55, 0.0, d));
  float fog = (1.0 - exp(-0.00006 * vDist * vDist)) * 0.82;
  vec3 col = mix(center, uFogColor, clamp(fog, 0.0, 1.0));
  outColor = vec4(col, 1.0);
}
`;

// ── Water ──
const WATER_VS = `#version 300 es
in vec3 aPos;
out vec3 vWorldPos;
out vec3 vNormal;
out float vDist;
uniform mat4 uProj, uView;
uniform vec3 uCamPos;
uniform float uTime;

// Sum-of-sines wave field: returns (height, dHeight/dx, dHeight/dz) so the
// surface normal can be derived analytically instead of staying flat.
vec3 waveField(vec2 p, float t) {
  vec2 dirs[5] = vec2[5](vec2(1.0,0.15), vec2(-0.55,0.83), vec2(0.32,-0.94), vec2(0.86,0.51), vec2(-0.78,-0.63));
  float freqs[5]  = float[5](0.095, 0.15, 0.26, 0.42, 0.66);
  float amps[5]   = float[5](0.38, 0.22, 0.12, 0.055, 0.026);
  float speeds[5] = float[5](0.75, 1.05, 1.4, 1.85, 2.35);
  float h = 0.0, dx = 0.0, dz = 0.0;
  for (int i = 0; i < 5; i++) {
    vec2 d = normalize(dirs[i]);
    float phase = (d.x*p.x + d.y*p.y) * freqs[i] + t * speeds[i];
    float s = sin(phase), c = cos(phase);
    h += amps[i] * s;
    dx += amps[i] * freqs[i] * d.x * c;
    dz += amps[i] * freqs[i] * d.y * c;
  }
  return vec3(h, dx, dz);
}

void main() {
  vec3 p = aPos;
  vec3 w = waveField(p.xz, uTime);
  p.y += w.x;
  vNormal = normalize(vec3(-w.y, 1.0, -w.z));
  vWorldPos = p;
  vDist = distance(p, uCamPos);
  gl_Position = uProj * uView * vec4(p, 1.0);
}
`;

const WATER_FS = `#version 300 es
precision highp float;
in vec3 vWorldPos;
in vec3 vNormal;
in float vDist;
out vec4 outColor;
uniform vec3 uCamPos;
uniform vec3 uSunDir;
uniform vec3 uFogColor;
uniform float uTime;
${NOISE_GLSL}
void main() {
  vec3 N = normalize(vNormal);
  vec3 viewDir = normalize(uCamPos - vWorldPos);
  float fresnel = pow(1.0 - clamp(dot(viewDir, N), 0.0, 1.0), 3.0);
  vec3 deep = vec3(0.04, 0.14, 0.20);
  vec3 shallow = vec3(0.14, 0.30, 0.30);
  vec3 col = mix(deep, shallow, fresnel);

  vec3 skyTint = vec3(0.80, 0.46, 0.36);
  col = mix(col, skyTint, fresnel * 0.6);

  // Wave-crest specular (moves with the real wave normal) plus a fine
  // noise-perturbed twinkle so the glitter isn't perfectly smooth.
  vec2 rp = vWorldPos.xz * 4.0 + vec2(uTime * 0.8, uTime * 0.55);
  float n = noiseG(rp);
  vec3 reflectDir = reflect(-viewDir, N);
  float spec = pow(max(dot(reflectDir, uSunDir), 0.0), 42.0);
  float twinkle = smoothstep(0.45, 0.95, n);
  col += vec3(1.0, 0.72, 0.48) * spec * (0.5 + twinkle * 1.8) * 2.2;

  float fog = (1.0 - exp(-0.00006 * vDist * vDist)) * 0.82;
  col = mix(col, uFogColor, clamp(fog, 0.0, 1.0));
  outColor = vec4(col, 1.0);
}
`;

// ── Trees (instanced, gentle foliage sway) ──
const TREE_VS = `#version 300 es
in vec3 aLocal;
in vec3 aNormal;
in vec3 aColorBase;
in float aSway;       // 0 at the tree's base, rising toward branch tips
in vec3 aInstPos;
in vec4 aInstData;    // scale, rotationY, phase, swayMul (small trees sway more)
out vec3 vColor;
out float vDist;
uniform mat4 uProj, uView;
uniform vec3 uCamPos, uSunDir;
uniform float uTime;
${NOISE_GLSL}
void main() {
  float ca = cos(aInstData.y), sa = sin(aInstData.y);
  vec3 scaled = aLocal * aInstData.x;
  vec3 rotated = vec3(scaled.x*ca - scaled.z*sa, scaled.y, scaled.x*sa + scaled.z*ca);
  vec3 normRot = vec3(aNormal.x*ca - aNormal.z*sa, aNormal.y, aNormal.x*sa + aNormal.z*ca);
  vec3 worldPos = aInstPos + rotated;

  vec2 wind = windAt(aInstPos.xz + aInstData.z * 3.0, uTime) * 0.42;
  float sway = aSway * aInstData.w;
  worldPos.x += wind.x * sway;
  worldPos.z += wind.y * sway;

  float diffuse = max(dot(normalize(normRot), uSunDir), 0.0);
  float lightF = diffuse * 0.55 + 0.5;
  vColor = aColorBase * lightF;
  vDist = distance(worldPos, uCamPos);
  gl_Position = uProj * uView * vec4(worldPos, 1.0);
}
`;

const TREE_FS = `#version 300 es
precision highp float;
in vec3 vColor;
in float vDist;
out vec4 outColor;
uniform vec3 uFogColor;
void main() {
  float fog = (1.0 - exp(-0.00006 * vDist * vDist)) * 0.82;
  vec3 col = mix(vColor, uFogColor, clamp(fog, 0.0, 1.0));
  outColor = vec4(col, 1.0);
}
`;

// ── Static "prop" meshes baked in world space (bridge, track) ──
const PROP_VS = `#version 300 es
in vec3 aPos;
in vec3 aColor;

// ── Steam puffs (billboard particles rising from the funnel, with turbulence) ──
const STEAM_VS = `#version 300 es
in vec2 aLocal;
in float aPhase;
out vec2 vLocal;
out float vAge;
out float vSeed;
out float vDist;
uniform mat4 uProj, uView;
uniform vec3 uCamRight, uCamUp, uCamPos;
uniform vec3 uFunnelPos, uFunnelDrift;
uniform float uTime;
void main() {
  float age = fract(uTime * 0.3 + aPhase);
  vAge = age;
  vSeed = aPhase;
  float size = mix(0.22, 2.4, pow(age, 0.55));
  // Turbulent rise: a couple of offset sine wobbles instead of a straight line,
  // growing with age so the plume billows rather than travelling in a rigid arc.
  float wobX = (sin(age * 13.0 + aPhase * 41.0) * 0.5 + sin(age * 5.0 + aPhase * 17.0) * 0.5) * age;
  float wobZ = (cos(age * 11.0 + aPhase * 29.0) * 0.5 + sin(age * 6.5 + aPhase * 23.0) * 0.5) * age;
  vec3 base = uFunnelPos
    + uFunnelDrift * age * 7.5
    + vec3(wobX * 1.1, pow(age, 0.75) * 6.5, wobZ * 1.1);
  vec3 worldPos = base + uCamRight * (aLocal.x * size) + uCamUp * (aLocal.y * size);
  vLocal = aLocal;
  vDist = distance(worldPos, uCamPos);
  gl_Position = uProj * uView * vec4(worldPos, 1.0);
}
`;

const STEAM_FS = `#version 300 es
precision highp float;
in vec2 vLocal;
in float vAge;
in float vSeed;
in float vDist;
out vec4 outColor;
uniform vec3 uFogColor;
float hashS(vec2 p) { return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }
void main() {
  float d = length(vLocal);
  if (d > 1.05) discard;
  // Fluffy, irregular edge instead of a perfect disc — offset a couple of
  // extra "lobes" so the silhouette reads as a cloud puff, not a circle.
  vec2 p = vLocal;
  float lobes = hashS(floor(p * 2.2) + vSeed * 13.0);
  float edgeR = 0.55 + lobes * 0.16;
  float shape = smoothstep(1.0, edgeR, d + (lobes - 0.5) * 0.18);
  float lifeFade = smoothstep(0.0, 0.10, vAge) * smoothstep(1.0, 0.5, vAge);
  float alpha = shape * lifeFade * 0.55;
  vec3 warm = vec3(1.0, 0.86, 0.70);
  vec3 cool = mix(vec3(0.90, 0.89, 0.90), uFogColor, 0.25);
  vec3 col = mix(warm, cool, smoothstep(0.05, 0.65, vAge));
  outColor = vec4(col, alpha);
}
`;

// ── Birds (small flapping silhouettes circling the sky) ──
const BIRD_VS = `#version 300 es
in vec2 aLocal;   // x: spanwise (-1..1, 0 = body), y: chordwise (0 = leading edge, -1 = tail)
in vec4 aInstData; // radius, height, speed, phase
out float vDist;
uniform mat4 uProj, uView;
uniform vec3 uCamPos;
uniform float uTime;
void main() {
  float ang = uTime * aInstData.z + aInstData.w;
  vec3 center = vec3(cos(ang) * aInstData.x, aInstData.y, sin(ang) * aInstData.x);
  float heading = ang + 1.5708;
  float flap = sin(uTime * 9.0 + aInstData.w * 10.0) * 0.55 + 0.45;
  vec3 local = vec3(aLocal.x * 1.7, abs(aLocal.x) * flap * 1.0, aLocal.y * 1.5);
  float ch = cos(heading), sh = sin(heading);
  vec3 rotated = vec3(local.x*ch - local.z*sh, local.y, local.x*sh + local.z*ch);
  vec3 worldPos = center + rotated;
  vDist = distance(worldPos, uCamPos);
  gl_Position = uProj * uView * vec4(worldPos, 1.0);
}
`;

const CLOUD_VS = `#version 300 es
in vec2 aLocal;
in vec3 aInstPos;
in vec4 aInstData; // size, drift speed, phase, tint

out float vTint;

uniform vec3 uCamRight, uCamUp, uCamPos;

function buildFrustum(radiusBottom, radiusTop, height, sides, colorBottom, colorTop, capBottom) {
  const positions = [], normals = [], colors = [];
  const slope = Math.atan2(radiusBottom - radiusTop, height);
  for (let i = 0; i < sides; i++) {
    const a0 = (i / sides) * Math.PI * 2, a1 = ((i + 1) / sides) * Math.PI * 2;
    const xb0 = Math.cos(a0) * radiusBottom, zb0 = Math.sin(a0) * radiusBottom;
    const xb1 = Math.cos(a1) * radiusBottom, zb1 = Math.sin(a1) * radiusBottom;
    const xt0 = Math.cos(a0) * radiusTop, zt0 = Math.sin(a0) * radiusTop;
    const xt1 = Math.cos(a1) * radiusTop, zt1 = Math.sin(a1) * radiusTop;
    const nxm = Math.cos((a0 + a1) / 2), nzm = Math.sin((a0 + a1) / 2);
    const ny = Math.sin(slope), nc = Math.cos(slope);
    positions.push(xb0,0,zb0,  xb1,0,zb1,  xt1,height,zt1);
    positions.push(xb0,0,zb0,  xt1,height,zt1,  xt0,height,zt0);
    for (let k = 0; k < 6; k++) normals.push(nxm*nc, ny, nzm*nc);
    colors.push(...colorBottom, ...colorBottom, ...colorTop, ...colorBottom, ...colorTop, ...colorTop);
  }
  if (capBottom) {
    for (let i = 0; i < sides; i++) {
      const a0 = (i / sides) * Math.PI * 2, a1 = ((i + 1) / sides) * Math.PI * 2;
      const xb0 = Math.cos(a0) * radiusBottom, zb0 = Math.sin(a0) * radiusBottom;
      const xb1 = Math.cos(a1) * radiusBottom, zb1 = Math.sin(a1) * radiusBottom;
      positions.push(0,0,0,  xb1,0,zb1,  xb0,0,zb0);
      for (let k = 0; k < 3; k++) normals.push(0,-1,0);
      colors.push(...colorBottom, ...colorBottom, ...colorBottom);
    }
  }
  return { positions, normals, colors };

  for (const f of faces) {
    const c = [color[0]*f.light, color[1]*f.light, color[2]*f.light];
    const [a,b,cc,d] = f.v;
    positions.push(
      cx+a[0],cy+a[1],cz+a[2],  cx+b[0],cy+b[1],cz+b[2],  cx+cc[0],cy+cc[1],cz+cc[2],
      cx+a[0],cy+a[1],cz+a[2],  cx+cc[0],cy+cc[1],cz+cc[2],  cx+d[0],cy+d[1],cz+d[2],
    );
    for (let k = 0; k < 6; k++) colors.push(...c);
  }
  return { positions, colors };
}

// ─────────────────────────────────────────────────────────
//  LAKE / WATER
// ─────────────────────────────────────────────────────────
let waterVao, waterVertCount, WATER_Y;
{
  const shoreSamples = 10;
  let minShore = Infinity;
  for (let i = 0; i < shoreSamples; i++) {
    const angle = (i / shoreSamples) * Math.PI * 2;
    const shoreF = lakeShoreFactor(angle) * 0.94;
    const sx = LAKE.x + Math.cos(angle) * LAKE.halfWidth * shoreF;
    const sz = LAKE.z + Math.sin(angle) * LAKE.halfLength * shoreF;
    minShore = Math.min(minShore, heightAt(sx, sz));
  }
  WATER_Y = minShore - 0.55;

  // Radial grid (center + concentric rings) so the wave field has enough
  // interior resolution, and the boundary naturally follows the irregular
  // per-angle shoreline instead of a plain ellipse fan.
  const segs = 80;
  const ringTs = [0.14, 0.30, 0.47, 0.63, 0.78, 0.90, 0.97];
  const positions = [LAKE.x, WATER_Y, LAKE.z];
  const ringStarts = [];
  for (let r = 0; r < ringTs.length; r++) {
    ringStarts.push(positions.length / 3);
    const t = ringTs[r];
    for (let i = 0; i <= segs; i++) {
      const angle = (i / segs) * Math.PI * 2;
      const shoreF = lakeShoreFactor(angle) * 0.94;
      const rw = LAKE.halfWidth * t * shoreF, rl = LAKE.halfLength * t * shoreF;
      positions.push(LAKE.x + Math.cos(angle) * rw, WATER_Y, LAKE.z + Math.sin(angle) * rl);
    }
  }
  const idx = [];
  for (let i = 0; i < segs; i++) idx.push(0, ringStarts[0]+i, ringStarts[0]+i+1);
  for (let r = 0; r < ringTs.length - 1; r++) {
    const a0 = ringStarts[r], a1 = ringStarts[r+1];
    for (let i = 0; i < segs; i++) {
      idx.push(a0+i, a1+i, a1+i+1);
      idx.push(a0+i, a1+i+1, a0+i+1);
    }
  }

  waterVao = gl.createVertexArray();
  gl.bindVertexArray(waterVao);
  const posBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(positions), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(waterProg.a.aPos);
  gl.vertexAttribPointer(waterProg.a.aPos, 3, gl.FLOAT, false, 0, 0);
  const idxBuf = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, idxBuf);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(idx), gl.STATIC_DRAW);
  waterVertCount = idx.length;
}

// ─────────────────────────────────────────────────────────
//  TREES — procedurally-branched variants, instanced
// ─────────────────────────────────────────────────────────
// Builds a tapered "branch" segment between two arbitrary 3D points (not just
// vertical), so recursive branching can point in any direction.
function frustumBetween(p0, p1, r0, r1, sides, color0, color1) {
  const dir = v3norm(v3sub(p1, p0));
  const upRef = Math.abs(dir[1]) < 0.95 ? [0,1,0] : [1,0,0];
  const right = v3norm(v3cross(upRef, dir));
  const up2 = v3cross(dir, right);
  const positions = [], normals = [], colors = [];
  const ring = (p, r, ca, sa) => v3add(p, v3add(v3scale(right, ca*r), v3scale(up2, sa*r)));
  for (let i = 0; i < sides; i++) {
    const a0 = (i/sides)*Math.PI*2, a1 = ((i+1)/sides)*Math.PI*2;
    const ca0=Math.cos(a0), sa0=Math.sin(a0), ca1=Math.cos(a1), sa1=Math.sin(a1);
    const amid=(a0+a1)/2, nrm = v3norm(v3add(v3scale(right,Math.cos(amid)), v3scale(up2,Math.sin(amid))));
    const p00=ring(p0,r0,ca0,sa0), p01=ring(p0,r0,ca1,sa1), p10=ring(p1,r1,ca0,sa0), p11=ring(p1,r1,ca1,sa1);
    positions.push(...p00,...p01,...p11, ...p00,...p11,...p10);
    for (let k=0;k<6;k++) normals.push(...nrm);
    colors.push(...color0,...color0,...color1, ...color0,...color1,...color1);
  }
  return { positions, normals, colors };
}
// Tilts 'dir' away from itself by 'tilt' radians, spread around it by 'spread'.
function tiltDir(dir, tilt, spread) {
  const upRef = Math.abs(dir[1]) < 0.95 ? [0,1,0] : [1,0,0];
  const right = v3norm(v3cross(upRef, dir));
  const up2 = v3cross(dir, right);
  const lateral = v3add(v3scale(right, Math.cos(spread)), v3scale(up2, Math.sin(spread)));
  return v3norm(v3add(v3scale(dir, Math.cos(tilt)), v3scale(lateral, Math.sin(tilt))));
}
// Procedurally grows one tree: a trunk that recursively forks into thinner
// branches, ending in small leaf clumps — genuinely self-similar/"fractal"
// rather than a fixed stacked-cone shape, and different every seed.
function genTreeVariant(seed) {
  const rng = mulberry32(seed);
  const positions = [], normals = [], colors = [];
  const barkA = [0.23+rng()*0.07, 0.15+rng()*0.05, 0.09+rng()*0.03];
  const barkB = [barkA[0]*1.3, barkA[1]*1.35, barkA[2]*1.3];
  const leafA = [0.07+rng()*0.06, 0.20+rng()*0.10, 0.07+rng()*0.05];
  const leafB = [leafA[0]+0.16, leafA[1]+0.22, leafA[2]+0.11];

  function addMesh(m) { positions.push(...m.positions); normals.push(...m.normals); colors.push(...m.colors); }
  function addFoliage(center, radius) {
    const lobes = 2 + Math.floor(rng()*3);
    for (let i = 0; i < lobes; i++) {
      const r = radius * (0.5 + rng()*0.55), h = radius * (1.1 + rng()*1.0);
      const off = [(rng()-0.5)*radius*0.9, rng()*radius*0.35, (rng()-0.5)*radius*0.9];
      const m = buildFrustum(r, r*0.04, h, 6, leafA, leafB, true);
      for (let k = 0; k < m.positions.length; k += 3) {
        positions.push(center[0]+off[0]+m.positions[k], center[1]+off[1]+m.positions[k+1], center[2]+off[2]+m.positions[k+2]);
      }
      normals.push(...m.normals);
      colors.push(...m.colors);
    }
  }
  const maxDepth = rng() < 0.45 ? 2 : 3;
  function grow(start, dir, length, radius, depth) {
    const end = v3add(start, v3scale(dir, length));
    addMesh(frustumBetween(start, end, radius, radius*0.6, 6, barkA, barkB));
    if (depth >= maxDepth || radius < 0.045) {
      addFoliage(end, Math.max(0.6, radius*4.6));
      return;
    }
    const branches = 2 + Math.floor(rng()*2);
    for (let i = 0; i < branches; i++) {
      const tilt = 0.4 + rng()*0.45;
      const spread = (i/branches)*Math.PI*2 + rng()*1.3;
      const newDir = tiltDir(dir, tilt, spread);
      grow(end, newDir, length*(0.6+rng()*0.14), radius*0.58, depth+1);
    }
  }
  const trunkHeight = 1.5 + rng()*1.3;
  const trunkRadius = 0.20 + rng()*0.11;
  grow([0,0,0], [0,1,0], trunkHeight, trunkRadius, 0);

  // Sway weight rises with height above ground (0 at the roots, 1 at the
  // tallest point) so wind bends the canopy/branch tips, not the base.
  let maxY = 0.01;
  for (let i = 1; i < positions.length; i += 3) if (positions[i] > maxY) maxY = positions[i];
  const sway = new Float32Array(positions.length / 3);
  for (let i = 0; i < sway.length; i++) sway[i] = Math.pow(Math.max(0, Math.min(1, positions[i*3+1] / maxY)), 1.5);

  return { positions: new Float32Array(positions), normals: new Float32Array(normals), colors: new Float32Array(colors), sway, height: maxY };
}

const TREE_VARIANTS = [1337, 91827, 4242, 60210, 777, 15990].map(genTreeVariant);
const TREE_COUNT = 260;
let treeCount, treeVaos;
{
  const buckets = TREE_VARIANTS.map(() => ({ instPos: [], instData: [] }));
  let n = 0, guard = 0;
  while (n < TREE_COUNT && guard < TREE_COUNT * 40) {
    guard++;
    const x = rand(-136, 136), z = rand(-136, 136);
    const distC = Math.hypot(x, z);
    if (distC < 42 && Math.random() > 0.05) continue;
    if (blockedByLakeOrTrack(x, z)) continue;
    if (lakeMask(x, z) > 0.02) continue;
    const variant = Math.floor(Math.random() * TREE_VARIANTS.length);
    const scale = rand(0.55, 1.6);
    // Small (young) trees are far more flexible and sway noticeably more,
    // including their "trunk"; big mature trees stay rigid and only their
    // canopy tips move gently.
    const t = smoothstepJS(0.55, 1.6, scale);
    const swayMul = lerp(2.4, 0.35, t);
    const b = buckets[variant];
    b.instPos.push(x, heightAt(x, z), z);
    b.instData.push(scale, Math.random() * Math.PI * 2, Math.random() * 100, swayMul);
    n++;
  }
  treeCount = n;

  function makeTreeVao(mesh, instPosArr, instDataArr) {
    const vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    const posBuf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
    gl.bufferData(gl.ARRAY_BUFFER, mesh.positions, gl.STATIC_DRAW);
    gl.enableVertexAttribArray(treeProg.a.aLocal);
    gl.vertexAttribPointer(treeProg.a.aLocal, 3, gl.FLOAT, false, 0, 0);

    const normBuf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, normBuf);
    gl.bufferData(gl.ARRAY_BUFFER, mesh.normals, gl.STATIC_DRAW);
    gl.enableVertexAttribArray(treeProg.a.aNormal);
    gl.vertexAttribPointer(treeProg.a.aNormal, 3, gl.FLOAT, false, 0, 0);

    const colBuf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, colBuf);
    gl.bufferData(gl.ARRAY_BUFFER, mesh.colors, gl.STATIC_DRAW);
    gl.enableVertexAttribArray(treeProg.a.aColorBase);
    gl.vertexAttribPointer(treeProg.a.aColorBase, 3, gl.FLOAT, false, 0, 0);

    const swayBuf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, swayBuf);
    gl.bufferData(gl.ARRAY_BUFFER, mesh.sway, gl.STATIC_DRAW);
    gl.enableVertexAttribArray(treeProg.a.aSway);
    gl.vertexAttribPointer(treeProg.a.aSway, 1, gl.FLOAT, false, 0, 0);

    const ipBuf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, ipBuf);
    gl.bufferData(gl.ARRAY_BUFFER, instPosArr, gl.STATIC_DRAW);
    gl.enableVertexAttribArray(treeProg.a.aInstPos);
    gl.vertexAttribPointer(treeProg.a.aInstPos, 3, gl.FLOAT, false, 0, 0);
    gl.vertexAttribDivisor(treeProg.a.aInstPos, 1);

    const idBuf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, idBuf);
    gl.bufferData(gl.ARRAY_BUFFER, instDataArr, gl.STATIC_DRAW);
    gl.enableVertexAttribArray(treeProg.a.aInstData);
    gl.vertexAttribPointer(treeProg.a.aInstData, 4, gl.FLOAT, false, 0, 0);
    gl.vertexAttribDivisor(treeProg.a.aInstData, 1);

    return { vao, vertCount: mesh.positions.length / 3, instCount: instPosArr.length / 3 };
  }

  treeVaos = TREE_VARIANTS.map((mesh, i) => makeTreeVao(mesh, new Float32Array(buckets[i].instPos), new Float32Array(buckets[i].instData)))
    .filter(v => v.instCount > 0);
}

// ─────────────────────────────────────────────────────────
//  BRIDGE + RAILWAY TRACK (static baked "prop" mesh)

{

  }

  // Bridge deck
  addBox(deckCenterX, BRIDGE_DECK_Y - 0.4, TRACK_Z, deckHalfSpan * 2, 0.9, deckWidth, STONE);
  // Parapets (low side walls)
  addBox(deckCenterX, BRIDGE_DECK_Y + 0.35, TRACK_Z - deckWidth/2 + 0.15, deckHalfSpan * 2, 0.6, 0.3, STONE_DARK);
  addBox(deckCenterX, BRIDGE_DECK_Y + 0.35, TRACK_Z + deckWidth/2 - 0.15, deckHalfSpan * 2, 0.6, 0.3, STONE_DARK);
  // Piers down into the lake
  const pierCount = 5;
  for (let i = 1; i <= pierCount; i++) {
    const px = deckCenterX - deckHalfSpan + (deckHalfSpan * 2) * (i / (pierCount + 1));
    const bottomY = WATER_Y - 5.5;

    addBox(x, y + 0.07, TRACK_Z, 1.7, 0.14, 2.6, sleeperColor);
  }

  for (let x = TRACK_X_START; x < TRACK_X_END; x += railStep) {

    const yMid = (y0 + y1) / 2, midLen = x2 - x;
    addBox((x+x2)/2, yMid, RAIL_Z0, midLen, 0.16, 0.14, railColor);
    addBox((x+x2)/2, yMid, RAIL_Z1, midLen, 0.16, 0.14, railColor);

  propVao = gl.createVertexArray();

  gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(positions), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(propProg.a.aPos);
  gl.vertexAttribPointer(propProg.a.aPos, 3, gl.FLOAT, false, 0, 0);
  const colBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, colBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(colors), gl.STATIC_DRAW);

}

// ─────────────────────────────────────────────────────────
//  STEAM TRAIN (object-space mesh, moved via a per-frame model matrix)
// ─────────────────────────────────────────────────────────
const TRAIN_SPEED = 4.2;         // world units / second

const FUNNEL_LOCAL = [2.0, 2.55, 0];
{
  const BOILER = [0.20, 0.20, 0.22], BOILER_DK = [0.14, 0.14, 0.16];
  const CAB = [0.30, 0.14, 0.12], CAB_DK = [0.22, 0.10, 0.09];
  const WHEEL = [0.08, 0.08, 0.08];
  const TRIM = [0.75, 0.60, 0.20];

  let positions = [], colors = [];
  function addBox(cx, cy, cz, sx, sy, sz, color) {
    const b = buildBox(cx, cy, cz, sx, sy, sz, color);
    positions.push(...b.positions); colors.push(...b.colors);
  }
  // Places a Y-axis cylinder/frustum with its axis instead lying along X
  // (front-to-back), centered at (cx,cy,cz) — used for the horizontal boiler.
  function addFrustumAlongX(cx, cy, cz, rb, rt, h, sides, colorB, colorT) {
    const m = buildFrustum(rb, rt, h, sides, colorB, colorT, true);
    for (let i = 0; i < m.positions.length; i += 3) {
      const px = m.positions[i], py = m.positions[i+1], pz = m.positions[i+2];
      positions.push(cx + (py - h/2), cy + px, cz + pz);
    }
    colors.push(...m.colors);
  }
  // Places a Y-axis cylinder/frustum with its axis instead lying along Z
  // (side-to-side) — used for wheels, so the disk faces sideways.
  function addFrustumAlongZ(cx, cy, cz, rb, rt, h, sides, colorB, colorT) {
    const m = buildFrustum(rb, rt, h, sides, colorB, colorT, true);
    for (let i = 0; i < m.positions.length; i += 3) {
      const px = m.positions[i], py = m.positions[i+1], pz = m.positions[i+2];
      positions.push(cx + px, cy + pz, cz + (py - h/2));
    }
    colors.push(...m.colors);
  }
  function addFrustumUpright(cx, cy, cz, rb, rt, h, sides, colorB, colorT) {
    const m = buildFrustum(rb, rt, h, sides, colorB, colorT, true);
    for (let i = 0; i < m.positions.length; i += 3) {
      positions.push(cx + m.positions[i], cy + m.positions[i+1], cz + m.positions[i+2]);
    }
    colors.push(...m.colors);
  }

  // Boiler (horizontal cylinder, front-to-back)
  addFrustumAlongX(0.3, 1.55, 0, 1.05, 1.05, 4.6, 10, BOILER, BOILER);
  // Smokebox front cap
  addBox(3.3, 1.55, 0, 0.25, 1.9, 1.9, BOILER_DK);
  // Funnel (upright)
  addFrustumUpright(FUNNEL_LOCAL[0], FUNNEL_LOCAL[1], FUNNEL_LOCAL[2], 0.34, 0.30, 1.0, 10, BOILER_DK, BOILER_DK);
  // Dome
  addFrustumUpright(0.4, 2.6, 0, 0.42, 0.05, 0.55, 10, TRIM, TRIM);
  // Cab
  addBox(-2.6, 1.9, 0, 2.4, 2.6, 2.3, CAB);
  addBox(-2.6, 3.25, 0, 2.5, 0.2, 2.4, CAB_DK); // cab roof
  // Footplate / running board
  addBox(-0.6, 0.55, 0, 6.6, 0.18, 2.5, CAB_DK);
  // Cowcatcher (angled wedge, approximated with a shallow box)
  addBox(3.65, 0.55, 0, 0.9, 0.7, 1.7, CAB_DK);
  // Tender (coal car, behind the cab)
  addBox(-5.1, 1.35, 0, 2.0, 1.9, 2.3, CAB);
  addBox(-5.1, 2.25, 0, 1.7, 0.5, 2.0, [0.1,0.1,0.1]);
  // Carriage (one, further behind)
  addBox(-8.6, 1.55, 0, 3.4, 2.3, 2.35, [0.42,0.24,0.16]);
  addBox(-8.6, 2.85, 0, 3.5, 0.3, 2.4, [0.30,0.17,0.12]);

  // Wheels (disks: cylinder axis along Z, so the flat face points sideways)
  function addWheel(cx, cz) {
    addFrustumAlongZ(cx, 0.55, cz, 0.55, 0.55, 0.35, 10, WHEEL, WHEEL);
  }
  for (const cx of [2.2, 0.6, -1.0, -2.6]) { addWheel(cx, -1.3); addWheel(cx, 1.3); }
  for (const cx of [-4.4, -5.8]) { addWheel(cx, -1.25); addWheel(cx, 1.25); }

  trainVao = gl.createVertexArray();
  gl.bindVertexArray(trainVao);
  const posBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(positions), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(trainProg.a.aPos);
  gl.vertexAttribPointer(trainProg.a.aPos, 3, gl.FLOAT, false, 0, 0);
  const colBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, colBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(colors), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(trainProg.a.aColor);
  gl.vertexAttribPointer(trainProg.a.aColor, 3, gl.FLOAT, false, 0, 0);
  trainVertCount = positions.length / 3;
}

    instData[i*4]   = rand(15, 48);          // radius
    instData[i*4+1] = rand(14, 24);          // height
    instData[i*4+2] = rand(0.12, 0.28) * (Math.random() < 0.5 ? 1 : -1); // speed/direction
    instData[i*4+3] = Math.random() * Math.PI * 2; // phase
  }
  birdVao = gl.createVertexArray();
  gl.bindVertexArray(birdVao);
  const localBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, localBuf);
  gl.bufferData(gl.ARRAY_BUFFER, local, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(birdProg.a.aLocal);
  gl.vertexAttribPointer(birdProg.a.aLocal, 2, gl.FLOAT, false, 0, 0);

  const dataBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, dataBuf);
  gl.bufferData(gl.ARRAY_BUFFER, instData, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(birdProg.a.aInstData);
  gl.vertexAttribPointer(birdProg.a.aInstData, 4, gl.FLOAT, false, 0, 0);
  gl.vertexAttribDivisor(birdProg.a.aInstData, 1);
  // aInstData must repeat per the 6 verts (3 per wing) of a single bird — but since
  // we draw BIRD_COUNT instances of a 6-vertex bird, divisor 1 is correct: each
  // instance draws both wings using the same per-instance flight data.

  const idxBuf = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, idxBuf);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx, gl.STATIC_DRAW);
}

// ─────────────────────────────────────────────────────────
//  CLOUDS (soft drifting billboards, several dabs per cluster)
// ─────────────────────────────────────────────────────────
const CLOUD_COUNT = 34;
let cloudVao;
{
  const localQuad = new Float32Array([-1,-1, 1,-1, -1,1, 1,1]);
  const quadIdx = new Uint16Array([0,1,2, 1,3,2]);

  const instPos = new Float32Array(CLOUD_COUNT * 3);
  const instData = new Float32Array(CLOUD_COUNT * 4);
  const clusters = 9;
  let idxN = 0;
  for (let c = 0; c < clusters; c++) {
    const cx = rand(-260, 260), cz = rand(-260, 260), cy = rand(58, 92);
    const dabs = 2 + Math.floor(Math.random() * 3);
    const speed = rand(1.4, 3.2);
    for (let k = 0; k < dabs && idxN < CLOUD_COUNT; k++, idxN++) {
      instPos[idxN*3]   = cx + rand(-14, 14);
      instPos[idxN*3+1] = cy + rand(-3, 3);
      instPos[idxN*3+2] = cz + rand(-14, 14);
      instData[idxN*4]   = rand(10, 20);
      instData[idxN*4+1] = speed;
      instData[idxN*4+2] = Math.random() * 100;
      instData[idxN*4+3] = Math.random();
    }
  }
  while (idxN < CLOUD_COUNT) {
    instPos[idxN*3] = rand(-260,260); instPos[idxN*3+1] = rand(58,92); instPos[idxN*3+2] = rand(-260,260);
    instData[idxN*4] = rand(10,20); instData[idxN*4+1] = rand(1.4,3.2); instData[idxN*4+2] = Math.random()*100; instData[idxN*4+3] = Math.random();
    idxN++;
  }

  cloudVao = gl.createVertexArray();
  gl.bindVertexArray(cloudVao);
  const localBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, localBuf);
  gl.bufferData(gl.ARRAY_BUFFER, localQuad, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(cloudProg.a.aLocal);
  gl.vertexAttribPointer(cloudProg.a.aLocal, 2, gl.FLOAT, false, 0, 0);

  const posBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
  gl.bufferData(gl.ARRAY_BUFFER, instPos, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(cloudProg.a.aInstPos);
  gl.vertexAttribPointer(cloudProg.a.aInstPos, 3, gl.FLOAT, false, 0, 0);
  gl.vertexAttribDivisor(cloudProg.a.aInstPos, 1);

  const dataBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, dataBuf);
  gl.bufferData(gl.ARRAY_BUFFER, instData, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(cloudProg.a.aInstData);
  gl.vertexAttribPointer(cloudProg.a.aInstData, 4, gl.FLOAT, false, 0, 0);
  gl.vertexAttribDivisor(cloudProg.a.aInstData, 1);

  const idxBuf = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, idxBuf);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, quadIdx, gl.STATIC_DRAW);
}

// ─────────────────────────────────────────────────────────
//  GRAIN OVERLAY (2D canvas, CSS-composited over the WebGL canvas)
// ─────────────────────────────────────────────────────────
{
  const gc = document.getElementById('grain');
  gc.width = 160; gc.height = 160;
  const gctx = gc.getContext('2d');
  const img = gctx.createImageData(160, 160);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = 255 * Math.random();
    img.data[i] = img.data[i+1] = img.data[i+2] = v;
    img.data[i+3] = 22;
  }
  gctx.putImageData(img, 0, 0);
  gc.style.backgroundImage = `url(${gc.toDataURL()})`;
  gc.style.backgroundRepeat = 'repeat';
  gc.style.imageRendering = 'pixelated';
}

// ─────────────────────────────────────────────────────────
//  CAMERA (orbit / pan / zoom)
// ─────────────────────────────────────────────────────────
const SUN_DIR = v3norm([0.62, 0.16, 0.24]);
const FOG_COLOR = [0.87, 0.46, 0.34];

let camTheta = 0.7, camPhi = 1.05, camRadius = 42;
let camTarget = [0, 2, 0];

function cameraVectors() {
  const eye = [
    camTarget[0] + camRadius * Math.sin(camPhi) * Math.sin(camTheta),
    camTarget[1] + camRadius * Math.cos(camPhi),
    camTarget[2] + camRadius * Math.sin(camPhi) * Math.cos(camTheta),
  ];
  const forward = v3norm(v3sub(camTarget, eye));
  const worldUp = [0, 1, 0];
  const right = v3norm(v3cross(forward, worldUp));
  const up = v3cross(right, forward);
  return { eye, forward, right, up };
}

let dragMode = null; // 'rotate' | 'pan'
let lastX = 0, lastY = 0;
let pinchDist = 0;

function hideHint() { document.getElementById('hint').style.opacity = '0'; }

canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('mousedown', e => {
  dragMode = (e.button === 2 || e.shiftKey) ? 'pan' : 'rotate';
  lastX = e.clientX; lastY = e.clientY;
});
window.addEventListener('mouseup', () => dragMode = null);
window.addEventListener('mousemove', e => {
  if (!dragMode) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  hideHint();
  if (dragMode === 'rotate') {
    camTheta -= dx * 0.0055;
    camPhi = Math.max(0.15, Math.min(1.48, camPhi - dy * 0.0055));
  } else {
    const { right, up } = cameraVectors();
    const k = camRadius * 0.0016;
    camTarget[0] += (-right[0]*dx + up[0]*dy) * k;
    camTarget[1] += (-right[1]*dx + up[1]*dy) * k;
    camTarget[2] += (-right[2]*dx + up[2]*dy) * k;
    camTarget[0] = Math.max(-130, Math.min(130, camTarget[0]));
    camTarget[2] = Math.max(-130, Math.min(130, camTarget[2]));
  }
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  hideHint();
  camRadius *= Math.pow(1.0015, e.deltaY);
  camRadius = Math.max(4, Math.min(180, camRadius));
}, { passive: false });

function touchPoint(t) { return [t.clientX, t.clientY]; }
canvas.addEventListener('touchstart', e => {
  hideHint();
  if (e.touches.length === 1) {
    dragMode = 'rotate';
    [lastX, lastY] = touchPoint(e.touches[0]);
  } else if (e.touches.length === 2) {
    dragMode = 'pinch';
    const [x0,y0] = touchPoint(e.touches[0]), [x1,y1] = touchPoint(e.touches[1]);
    pinchDist = Math.hypot(x1-x0, y1-y0);
    lastX = (x0+x1)/2; lastY = (y0+y1)/2;
  }
}, { passive: true });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (dragMode === 'rotate' && e.touches.length === 1) {
    const [x, y] = touchPoint(e.touches[0]);
    const dx = x - lastX, dy = y - lastY;
    lastX = x; lastY = y;
    camTheta -= dx * 0.006;
    camPhi = Math.max(0.15, Math.min(1.48, camPhi - dy * 0.006));
  } else if (dragMode === 'pinch' && e.touches.length === 2) {
    const [x0,y0] = touchPoint(e.touches[0]), [x1,y1] = touchPoint(e.touches[1]);
    const dist = Math.hypot(x1-x0, y1-y0);
    camRadius *= pinchDist / Math.max(1, dist);
    camRadius = Math.max(4, Math.min(180, camRadius));
    pinchDist = dist;
    const mx = (x0+x1)/2, my = (y0+y1)/2;
    const dx = mx - lastX, dy = my - lastY;
    lastX = mx; lastY = my;
    const { right, up } = cameraVectors();
    const k = camRadius * 0.0016;
    camTarget[0] += (-right[0]*dx + up[0]*dy) * k;
    camTarget[2] += (-right[2]*dx + up[2]*dy) * k;
  }
}, { passive: false });
window.addEventListener('touchend', e => { if (e.touches.length === 0) dragMode = null; });

// ─────────────────────────────────────────────────────────
//  RESIZE
// ─────────────────────────────────────────────────────────
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

// ─────────────────────────────────────────────────────────
//  RENDER LOOP
// ─────────────────────────────────────────────────────────
gl.enable(gl.DEPTH_TEST);
gl.clearColor(FOG_COLOR[0], FOG_COLOR[1], FOG_COLOR[2], 1);

function frame(now) {
  const time = now * 0.001;
  const { eye, forward, right, up } = cameraVectors();
  const aspect = W / H;
  const fovy = 55 * Math.PI / 180;
  const proj = mat4Perspective(fovy, aspect, 0.1, 420);
  const view = mat4LookAt(eye, camTarget, up);

  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  // Sky
  gl.depthMask(false);
  gl.useProgram(skyProg.program);
  gl.uniform3fv(skyProg.u.uCamForward, forward);
  gl.uniform3fv(skyProg.u.uCamRight, right);
  gl.uniform3fv(skyProg.u.uCamUp, up);
  gl.uniform1f(skyProg.u.uAspect, aspect);
  gl.uniform1f(skyProg.u.uTanFov, Math.tan(fovy / 2));
  gl.uniform3fv(skyProg.u.uSunDir, SUN_DIR);
  gl.uniform1f(skyProg.u.uTime, time);
  gl.bindVertexArray(skyVao);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  gl.depthMask(true);

  // Terrain
  gl.useProgram(terrainProg.program);
  gl.uniformMatrix4fv(terrainProg.u.uProj, false, proj);
  gl.uniformMatrix4fv(terrainProg.u.uView, false, view);
  gl.uniform3fv(terrainProg.u.uCamPos, eye);
  gl.uniform3fv(terrainProg.u.uSunDir, SUN_DIR);
  gl.uniform3fv(terrainProg.u.uFogColor, FOG_COLOR);
  gl.bindVertexArray(terrainVao);
  gl.drawElements(gl.TRIANGLES, terrainIndexCount, gl.UNSIGNED_INT, 0);

  // Lake water
  gl.useProgram(waterProg.program);
  gl.uniformMatrix4fv(waterProg.u.uProj, false, proj);
  gl.uniformMatrix4fv(waterProg.u.uView, false, view);
  gl.uniform3fv(waterProg.u.uCamPos, eye);
  gl.uniform3fv(waterProg.u.uSunDir, SUN_DIR);
  gl.uniform3fv(waterProg.u.uFogColor, FOG_COLOR);
  gl.uniform1f(waterProg.u.uTime, time);
  gl.bindVertexArray(waterVao);
  gl.drawElements(gl.TRIANGLES, waterVertCount, gl.UNSIGNED_SHORT, 0);

  // Trees (each variant is its own instanced draw)
  gl.useProgram(treeProg.program);
  gl.uniformMatrix4fv(treeProg.u.uProj, false, proj);
  gl.uniformMatrix4fv(treeProg.u.uView, false, view);
  gl.uniform3fv(treeProg.u.uCamPos, eye);
  gl.uniform3fv(treeProg.u.uSunDir, SUN_DIR);
  gl.uniform3fv(treeProg.u.uFogColor, FOG_COLOR);
  gl.uniform1f(treeProg.u.uTime, time);
  for (const tv of treeVaos) {
    gl.bindVertexArray(tv.vao);
    gl.drawArraysInstanced(gl.TRIANGLES, 0, tv.vertCount, tv.instCount);
  }

  // Bridge + railway track
  gl.useProgram(propProg.program);
  gl.uniformMatrix4fv(propProg.u.uProj, false, proj);
  gl.uniformMatrix4fv(propProg.u.uView, false, view);
  gl.uniform3fv(propProg.u.uCamPos, eye);
  gl.uniform3fv(propProg.u.uFogColor, FOG_COLOR);
  gl.bindVertexArray(propVao);
  gl.drawArrays(gl.TRIANGLES, 0, propVertCount);

  // Steam train — position along the route, ping-ponging across the bridge
  const cyclePos = (time * TRAIN_SPEED) % (TRAIN_ROUTE_LEN * 2);
  const routeT = cyclePos < TRAIN_ROUTE_LEN ? cyclePos : (TRAIN_ROUTE_LEN * 2 - cyclePos);
  const trainDir = cyclePos < TRAIN_ROUTE_LEN ? 1 : -1;
  const trainX = TRACK_X_START + 5 + routeT;
  const trainPos = [trainX, trackGradeY(trainX) + 0.55, TRACK_Z];
  const trainHeading = trainDir > 0 ? 0 : Math.PI;
  const thc = Math.cos(trainHeading), ths = Math.sin(trainHeading);
  const trainModel = new Float32Array([
    thc, 0, -ths, 0,
    0, 1, 0, 0,
    ths, 0, thc, 0,
    trainPos[0], trainPos[1], trainPos[2], 1,
  ]);
  const funnelWorld = [
    thc * FUNNEL_LOCAL[0] + ths * FUNNEL_LOCAL[2] + trainPos[0],
    FUNNEL_LOCAL[1] + trainPos[1],
    -ths * FUNNEL_LOCAL[0] + thc * FUNNEL_LOCAL[2] + trainPos[2],
  ];
  const forwardDir = [thc, 0, -ths];

  gl.useProgram(trainProg.program);
  gl.uniformMatrix4fv(trainProg.u.uProj, false, proj);
  gl.uniformMatrix4fv(trainProg.u.uView, false, view);
  gl.uniformMatrix4fv(trainProg.u.uModel, false, trainModel);
  gl.uniform3fv(trainProg.u.uCamPos, eye);
  gl.uniform3fv(trainProg.u.uFogColor, FOG_COLOR);
  gl.bindVertexArray(trainVao);
  gl.drawArrays(gl.TRIANGLES, 0, trainVertCount);

  // Grass
  gl.useProgram(grassProg.program);
  gl.uniformMatrix4fv(grassProg.u.uProj, false, proj);
  gl.uniformMatrix4fv(grassProg.u.uView, false, view);
  gl.uniform3fv(grassProg.u.uCamPos, eye);
  gl.uniform1f(grassProg.u.uTime, time);
  gl.uniform3fv(grassProg.u.uFogColor, FOG_COLOR);
  gl.bindVertexArray(grassVao);
  gl.drawElementsInstanced(gl.TRIANGLES, 18, gl.UNSIGNED_SHORT, 0, grassCount);

  // Flowers
  gl.useProgram(flowerProg.program);
  gl.uniformMatrix4fv(flowerProg.u.uProj, false, proj);
  gl.uniformMatrix4fv(flowerProg.u.uView, false, view);
  gl.uniform3fv(flowerProg.u.uCamPos, eye);
  gl.uniform3fv(flowerProg.u.uCamRight, right);
  gl.uniform3fv(flowerProg.u.uCamUp, up);
  gl.uniform1f(flowerProg.u.uTime, time);
  gl.uniform3fv(flowerProg.u.uFogColor, FOG_COLOR);
  gl.bindVertexArray(flowerVao);
  gl.drawElementsInstanced(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0, FLOWER_COUNT);

  // Birds
  gl.useProgram(birdProg.program);
  gl.uniformMatrix4fv(birdProg.u.uProj, false, proj);
  gl.uniformMatrix4fv(birdProg.u.uView, false, view);
  gl.uniform3fv(birdProg.u.uCamPos, eye);
  gl.uniform3fv(birdProg.u.uFogColor, FOG_COLOR);
  gl.uniform1f(birdProg.u.uTime, time);
  gl.bindVertexArray(birdVao);
  gl.drawElementsInstanced(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0, BIRD_COUNT);

  // Alpha-blended layer: steam puffs + clouds
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.depthMask(false);

  gl.useProgram(steamProg.program);
  gl.uniformMatrix4fv(steamProg.u.uProj, false, proj);
  gl.uniformMatrix4fv(steamProg.u.uView, false, view);
  gl.uniform3fv(steamProg.u.uCamRight, right);
  gl.uniform3fv(steamProg.u.uCamUp, up);
  gl.uniform3fv(steamProg.u.uCamPos, eye);
  gl.uniform3fv(steamProg.u.uFunnelPos, funnelWorld);
  gl.uniform3fv(steamProg.u.uFunnelDrift, [-forwardDir[0]*0.5, 0, -forwardDir[2]*0.5]);
  gl.uniform1f(steamProg.u.uTime, time);
  gl.uniform3fv(steamProg.u.uFogColor, FOG_COLOR);
  gl.bindVertexArray(steamVao);
  gl.drawElementsInstanced(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0, STEAM_COUNT);

  gl.useProgram(cloudProg.program);
  gl.uniformMatrix4fv(cloudProg.u.uProj, false, proj);
  gl.uniformMatrix4fv(cloudProg.u.uView, false, view);
  gl.uniform3fv(cloudProg.u.uCamRight, right);
  gl.uniform3fv(cloudProg.u.uCamUp, up);
  gl.uniform3fv(cloudProg.u.uCamPos, eye);
  gl.uniform1f(cloudProg.u.uTime, time);
  gl.bindVertexArray(cloudVao);
  gl.drawElementsInstanced(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0, CLOUD_COUNT);

  gl.depthMask(true);
  gl.disable(gl.BLEND);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
